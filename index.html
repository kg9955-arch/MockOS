<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description"
    content="MockOS — A web-based desktop operating system simulator built with vanilla HTML, CSS, and JavaScript. No frameworks, no dependencies.">
  <meta name="theme-color" content="#0e0e12">
  <meta name="author" content="MockOS">
  <meta property="og:title" content="MockOS">
  <meta property="og:description"
    content="A fully functional desktop OS in your browser — windows, apps, themes, and more.">
  <meta property="og:type" content="website">
  <title>MockOS</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <!-- Desktop -->
  <div id="desktop" oncontextmenu="deskCtx(event)">
    <div id="desktop-bg"></div>
    <div id="desktop-grid"></div>
    <div id="desktop-icon-area"></div>
  </div>

  <!-- Taskbar -->
  <div id="taskbar">
    <div id="start-btn" onclick="toggleStart(event)">◈</div>
    <div class="taskbar-sep"></div>
    <div id="taskbar-items"></div>
    <div id="taskbar-right">
      <span class="sys-icon" onclick="notify('Network','Connected · 142 Mbps')">🌐</span>
      <span class="sys-icon" onclick="notify('Sound','Volume 100%')">🔊</span>
      <div id="taskbar-clock"></div>
    </div>
  </div>

  <!-- Start Menu -->
  <div id="start-menu">
    <div id="sm-top">
      <input type="text" id="sm-search" placeholder="Search apps..." oninput="smSearch(this.value)" autocomplete="off">
      <div id="sm-user" onclick="openApp('settings','account');closeStart()">
        <div id="sm-avatar">👤</div>
        <span id="sm-username">User</span>
      </div>
    </div>

    <div id="sm-body">
      <div id="sm-sidebar">
        <div class="sm-side-btn active" data-tip="Home" onclick="smNav(this,'home')">🏠</div>
        <div class="sm-side-btn" data-tip="All Apps" onclick="smNav(this,'apps')">⊞</div>
        <div class="sm-side-btn" data-tip="Recent" onclick="smNav(this,'recent')">🕐</div>
        <div class="sm-side-btn" data-tip="Settings" onclick="openApp('settings');closeStart()">⚙️</div>
      </div>

      <div id="sm-content">
        <!-- Home -->
        <div class="sm-section visible" id="sms-home">
          <div class="sm-title">Pinned Apps</div>
          <div id="sm-pinned-grid"></div>
          <div class="sm-title" style="margin-top:4px">Recent</div>
          <div id="sm-recent-short"></div>
          <div style="margin-top:4px;font-size:11px;color:var(--text-muted);text-align:center;opacity:0.6">Double-click
            desktop icons to open apps faster</div>
        </div>

        <!-- All Apps -->
        <div class="sm-section" id="sms-apps">
          <div class="sm-title">All Applications</div>
          <div id="sm-all-grid"></div>
        </div>

        <!-- Recent -->
        <div class="sm-section" id="sms-recent">
          <div class="sm-title">Recently Opened</div>
          <div id="sm-recent-full"></div>
        </div>

        <!-- Search -->
        <div class="sm-section" id="sms-search">
          <div class="sm-title">Search Results</div>
          <div id="sm-search-grid" style="display:grid;grid-template-columns:repeat(5,1fr);gap:6px"></div>
          <div id="sm-search-empty" style="color:var(--text-muted);font-size:13px;display:none;margin-top:8px">No apps
            found.</div>
        </div>
      </div>
    </div>

    <div id="sm-footer">
      <button class="sm-footer-btn" onclick="openApp('settings');closeStart()">⚙️ Settings</button>
      <button class="sm-footer-btn"
        onclick="closeStart();notify(osName,'Restarting...');setTimeout(()=>location.reload(),1400)">🔄 Restart</button>
      <button class="sm-footer-btn" onclick="shutdown()">⏻ Shut Down</button>
    </div>
  </div>

  <!-- Context Menu -->
  <div id="ctx-menu"></div>

  <!-- Notification -->
  <div id="notification">
    <div id="notif-title"></div>
    <div id="notif-body"></div>
  </div>

  <!-- Hidden file inputs -->
  <input type="file" id="fi-wp" accept="image/*" style="display:none">
  <input type="file" id="fi-style" accept=".css,.html" style="display:none">
  <input type="file" id="fi-open" accept="*/*" style="display:none">

  <!-- JavaScript Modules (loaded in dependency order) -->
  <script src="js/ui-helpers.js"></script>
  <script src="js/window-manager.js"></script>
  <script src="js/app-registry.js"></script>
  <script src="js/taskbar.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/apps.js"></script>
  <script src="js/app-builder.js"></script>
  <script src="js/state.js"></script>
  <script src="js/init.js"></script>

</body>

</html>
